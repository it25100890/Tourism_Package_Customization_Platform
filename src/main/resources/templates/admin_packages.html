<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VibeRoute - Admin Packages</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body style="background: #f4f7f6;">
<nav class="navbar navbar-expand-lg bg-dark">
    <a class="navbar-brand text-warning" th:href="@{/}" style="font-family: 'Pacifico', cursive;">VibeRoute Admin</a>
</nav>

<div class="container mt-5">
    <h2 class="mb-4" style="color: #003366; font-weight: bold;">Package Management (Student 2)</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white" id="formTitle">Add New Package</div>
                <div class="card-body">
                    <form th:action="@{/admin/packages/add}" method="post" id="packageForm">
                        <input type="hidden" name="id">
                        <div class="form-group"><label>Title</label><input type="text" name="title" class="form-control" required></div>
                        <div class="form-group"><label>Destination</label><input type="text" name="destination" class="form-control" required></div>
                        <div class="form-group"><label>Price ($)</label><input type="number" step="0.01" name="price" class="form-control" required></div>
                        <div class="form-group">
                            <label>Category</label>
                            <select name="category" class="form-control">
                                <option value="Beach">Beach</option>
                                <option value="Cultural">Cultural</option>
                                <option value="Adventure">Adventure</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success btn-block" id="submitBtn">Add Tour</button>
                        <a th:href="@{/admin/packages}" class="btn btn-link btn-block btn-sm text-muted">Reset Form</a>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">Available Tours</div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>ID</th><th>Title</th><th>Destination</th><th>Price</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${packages}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.title}"></td>
                            <td th:text="${p.destination}"></td>
                            <td th:text="'$' + ${p.price}"></td>
                            <td>
                                <button class="btn btn-sm btn-info" th:onclick="'fillEditForm(\'' + ${p.id} + '\', \'' + ${p.title} + '\', \'' + ${p.destination} + '\', \'' + ${p.price} + '\', \'' + ${p.category} + '\')'">Edit</button>
                                <a th:href="@{'/admin/packages/delete/' + ${p.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this package?')">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillEditForm(id, title, dest, price, cat) {
        document.getElementById('formTitle').innerText = "Edit Package: " + id;
        document.getElementsByName('id')[0].value = id;
        document.getElementsByName('title')[0].value = title;
        document.getElementsByName('destination')[0].value = dest;
        document.getElementsByName('price')[0].value = price;
        document.getElementsByName('category')[0].value = cat;
        document.getElementById('submitBtn').innerText = "Update Tour";
        document.getElementById('packageForm').action = "/admin/packages/update";
    }
</script>
</body>
</html>
