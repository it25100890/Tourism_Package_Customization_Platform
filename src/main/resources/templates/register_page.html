<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VibeRoute - Create Account</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body class="bg-register">
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" th:href="@{/}" style="font-family: 'Pacifico', cursive; color: white;">VibeRoute</a>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0" style="background: rgba(255, 255, 255, 0.9); border-radius: 15px;">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4" style="color: #003366; font-weight: bold;">Create Account</h2>
                        <form th:action="@{/register}" method="post" id="regForm">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" name="fullName" class="form-control" placeholder="Alex" required>
                                <div class="invalid-feedback">Please enter your full name.</div>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="username" id="email" class="form-control" placeholder="alex@mail.com" required 
                                       pattern=".*(\.com|\.lk)$">
                                <small class="form-text text-muted">Must end with .com or .lk</small>
                                <div class="invalid-feedback">Email must end with .com or .lk</div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Phone Number</label>
                                        <input type="text" name="phone" id="phone" class="form-control" placeholder="07XXXXXXXX" required
                                               pattern="\d{10}">
                                        <div class="invalid-feedback">Phone number must be exactly 10 digits.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Gender</label>
                                        <select name="gender" class="form-control" required>
                                            <option value="" disabled selected>Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>NIC / Passport Number</label>
                                        <input type="text" name="nicPassport" id="nicPassport" class="form-control" placeholder="12 digits for NIC or 1 letter + 7 digits for Passport" required>
                                        <div class="invalid-feedback" id="nicFeedback">NIC must be 12 digits, Passport must be 1 letter + 7 digits.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Birthday</label>
                                        <input type="date" name="birthday" id="birthday" class="form-control" required
                                               min="1950-01-01" max="2020-12-31">
                                        <div class="invalid-feedback">Birthday must be between 1950 and 2020.</div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Country</label>
                                <select name="country" class="form-control" required>
                                    <option value="" disabled selected>Select your country...</option>
                                    <option value="Sri Lanka">Sri Lanka</option>
                                    <option value="India">India</option>
                                    <option value="United Kingdom">United Kingdom</option>
                                    <option value="United States">USA</option>
                                    <option value="Australia">Australia</option>
                                    <option value="Canada">Canada</option>
                                    <option value="Germany">Germany</option>
                                    <option value="France">France</option>
                                    <option value="Japan">Japan</option>
                                    <option value="United Arab Emirates">UAE</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                            </div>
                            <button type="submit" class="btn btn-warning btn-block font-weight-bold py-2 mt-3">Register Now</button>
                        </form>

                        <script>
                            document.getElementById('regForm').addEventListener('submit', function(event) {
                                let valid = true;
                                const form = event.target;
                                
                                // Email validation
                                const email = document.getElementById('email');
                                if (!email.value.match(/.*(\.com|\.lk)$/)) {
                                    email.classList.add('is-invalid');
                                    valid = false;
                                } else {
                                    email.classList.remove('is-invalid');
                                }

                                // Phone validation
                                const phone = document.getElementById('phone');
                                if (!phone.value.match(/^\d{10}$/)) {
                                    phone.classList.add('is-invalid');
                                    valid = false;
                                } else {
                                    phone.classList.remove('is-invalid');
                                }

                                // NIC/Passport validation
                                const nic = document.getElementById('nicPassport');
                                const nicVal = nic.value;
                                const nicPattern = /^\d{12}$/;
                                const passportPattern = /^[A-Z]{1}\d{7}$/i;
                                if (!nicVal.match(nicPattern) && !nicVal.match(passportPattern)) {
                                    nic.classList.add('is-invalid');
                                    valid = false;
                                } else {
                                    nic.classList.remove('is-invalid');
                                }

                                // Birthday validation
                                const bday = document.getElementById('birthday');
                                const bdayVal = new Date(bday.value);
                                const minDate = new Date('1950-01-01');
                                const maxDate = new Date('2020-12-31');
                                if (bdayVal < minDate || bdayVal > maxDate) {
                                    bday.classList.add('is-invalid');
                                    valid = false;
                                } else {
                                    bday.classList.remove('is-invalid');
                                }

                                if (!valid || !form.checkValidity()) {
                                    event.preventDefault();
                                    event.stopPropagation();
                                }
                                form.classList.add('was-validated');
                            }, false);
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
