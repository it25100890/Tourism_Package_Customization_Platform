<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VibeRoute - My Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body class="bg-register">
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" th:href="@{/}" style="font-family: 'Pacifico', cursive; color: white;">VibeRoute</a>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-lg border-0" style="background: rgba(255, 255, 255, 0.95); border-radius: 15px;">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-circle fa-4x text-primary mb-2"></i>
                            <h2 style="color: #003366; font-weight: bold;">Update Profile</h2>
                            <p class="text-muted">Keep your details up to date</p>
                        </div>
                        
                        <form th:action="@{/profile/update}" method="post" id="profileForm" th:object="${user}">
                            <div class="form-group">
                                <label class="font-weight-bold">Full Name</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="font-weight-bold">Email Address (Username)</label>
                                <input type="email" th:field="*{username}" class="form-control bg-light" readonly>
                                <small class="text-muted">Email cannot be changed as it is your unique ID.</small>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="font-weight-bold">Phone Number</label>
                                        <input type="text" th:field="*{phone}" id="phone" class="form-control" required pattern="\d{10}">
                                        <div class="invalid-feedback">Phone number must be exactly 10 digits.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="font-weight-bold">Gender</label>
                                        <select th:field="*{gender}" class="form-control" required>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="font-weight-bold">NIC / Passport Number</label>
                                        <input type="text" th:field="*{nicPassport}" id="nicPassport" class="form-control" required>
                                        <div class="invalid-feedback">NIC (12 digits) or Passport (1 letter + 7 digits) required.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="font-weight-bold">Date of Birth</label>
                                        <input type="date" th:field="*{birthday}" id="birthday" class="form-control" required min="1950-01-01" max="2020-12-31">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="font-weight-bold">Country</label>
                                <select th:field="*{country}" class="form-control" required>
                                    <option value="Sri Lanka">Sri Lanka</option>
                                    <option value="India">India</option>
                                    <option value="United Kingdom">United Kingdom</option>
                                    <option value="United States">USA</option>
                                    <option value="Australia">Australia</option>
                                    <option value="Canada">Canada</option>
                                    <option value="Germany">Germany</option>
                                    <option value="France">France</option>
                                    <option value="Japan">Japan</option>
                                    <option value="United Arab Emirates">UAE</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="font-weight-bold">New Password (leave empty to keep current)</label>
                                <input type="password" name="newPassword" class="form-control" placeholder="Optional">
                                <input type="hidden" th:field="*{password}">
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary font-weight-bold px-5">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', function(event) {
            let valid = true;
            const form = event.target;
            
            // Phone validation
            const phone = document.getElementById('phone');
            if (!phone.value.match(/^\d{10}$/)) {
                phone.classList.add('is-invalid');
                valid = false;
            } else {
                phone.classList.remove('is-invalid');
            }

            // NIC/Passport validation
            const nic = document.getElementById('nicPassport');
            const nicVal = nic.value;
            const nicPattern = /^\d{12}$/;
            const passportPattern = /^[A-Z]{1}\d{7}$/i;
            if (!nicVal.match(nicPattern) && !nicVal.match(passportPattern)) {
                nic.classList.add('is-invalid');
                valid = false;
            } else {
                nic.classList.remove('is-invalid');
            }

            if (!valid || !form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    </script>
</body>
</html>
